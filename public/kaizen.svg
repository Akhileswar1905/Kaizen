<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4"/>

  <g transform="translate(24, 24)">
    <rect x="120" y="140" width="50" height="232" rx="10" fill="#a1a1aa" opacity="0.25" />
    
    <rect x="200" y="292" width="50" height="80" rx="12" fill="url(#emeraldGrad)" opacity="0.6" />
    
    <rect x="270" y="216" width="50" height="156" rx="12" fill="url(#emeraldGrad)" opacity="0.8" />
    
    <rect x="340" y="140" width="50" height="232" rx="12" fill="url(#emeraldGrad)" filter="url(#glow)" />
    
    <path d="M 145 140 L 365 240" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.4" stroke-dasharray="8 8" />
  </g>
</svg>
